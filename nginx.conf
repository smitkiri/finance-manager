upstream express {
    server host.docker.internal:3001;
}

upstream fastapi {
    server host.docker.internal:8000;
}

server {
    listen 80;
    client_max_body_size 10M;

    # Health check (FastAPI)
    location = /api/health {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Users (FastAPI)
    location /api/users {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Categories (FastAPI)
    location /api/categories {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Labels (FastAPI)
    location /api/labels {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sources (FastAPI)
    location /api/sources {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Date range (FastAPI)
    location /api/date-range {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Expenses (FastAPI)
    location /api/expenses {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Stats (FastAPI)
    location = /api/stats {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reports (FastAPI)
    location /api/reports {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Transfer override (FastAPI)
    location = /api/transfer-override {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Detect transfers (FastAPI)
    location = /api/detect-transfers {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rerun transfer detection (FastAPI)
    location = /api/rerun-transfer-detection {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Catch-all: everything goes to Express for now
    location /api/ {
        proxy_pass http://express;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
