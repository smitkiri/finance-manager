version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: expense_tracker_test_db
    environment:
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker_password
      POSTGRES_DB: expense_tracker_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense_tracker']
      interval: 5s
      timeout: 5s
      retries: 5
