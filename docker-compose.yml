version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finance_manager_db
    environment:
      POSTGRES_USER: finance_manager
      POSTGRES_PASSWORD: finance_manager_password
      POSTGRES_DB: finance_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance_manager']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: expense_tracker_nginx
    ports:
      - '3002:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
