pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: gitleaks git --staged --verbose
    prettier-ts:
      glob: '*.{ts,tsx}'
      run: npx prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    prettier-js:
      glob: '*.js'
      run: npx prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    prettier-other:
      glob: '*.{json,css,md,html,yml,yaml}'
      run: npx prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    eslint-ts:
      glob: '*.{ts,tsx}'
      run: npx eslint --fix --max-warnings 0 {staged_files} && git add {staged_files}
      stage_fixed: true
    eslint-js:
      glob: '*.js'
      run: npx eslint --fix --max-warnings 0 {staged_files} && git add {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npx tsc --noEmit
    related-frontend-tests:
      glob: 'src/**/*.{ts,tsx}'
      run: npx react-scripts test --bail --watchAll=false --findRelatedTests {push_files}
    related-backend-tests:
      glob: '{routes,helpers,tests}/**/*.js'
      run: NODE_ENV=test DB_NAME=expense_tracker_test DB_PORT=5433 npx jest --config jest.backend.config.js --bail --findRelatedTests {push_files}
