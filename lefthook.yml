pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: gitleaks git --staged --verbose
    prettier-ts:
      glob: '*.{ts,tsx}'
      run: npx prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    prettier-js:
      glob: '*.js'
      run: npx prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    prettier-other:
      glob: '*.{json,css,md,html,yml,yaml}'
      run: npx prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    eslint-ts:
      glob: '*.{ts,tsx}'
      run: npx eslint --fix --max-warnings 0 {staged_files} && git add {staged_files}
      stage_fixed: true
    eslint-js:
      glob: '*.js'
      run: npx eslint --fix --max-warnings 0 {staged_files} && git add {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npx tsc --noEmit
    related-tests:
      glob: '*.{ts,tsx,js}'
      run: npx jest --bail --passWithNoTests --findRelatedTests {push_files}
